# Deploys SQL in supabase/migrations/ to the linked Supabase project (production).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — create at https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — Project ID from dashboard URL: .../project/<this-part>/...
#   SUPABASE_DB_PASSWORD   — Database password (Project Settings → Database)
#
# Docs: https://supabase.com/docs/guides/cli/managing-environments

name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check secrets
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF}" || { echo "Missing secret SUPABASE_PROJECT_REF"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing secret SUPABASE_DB_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project (non-interactive)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Push pending migrations
        run: supabase db push
